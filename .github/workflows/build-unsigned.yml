name: Build unsigned iOS artifact

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # UTC 19:17 = 次日北京时间 03:17，避开整点高峰。
    - cron: "17 19 * * *"

permissions:
  contents: read

concurrency:
  group: build-ios-unsigned-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  # Do not interrupt a release transaction when a newer main push arrives.
  # Stale successful builds are filtered before rolling publication.
  cancel-in-progress: false

jobs:
  select_run:
    name: Avoid duplicate branch and tag builds
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.decision.outputs.should_build }}

    steps:
      - name: Checkout branch push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select build run
        id: decision
        shell: bash
        run: |
          set -euo pipefail

          SHOULD_BUILD=true
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            MATCHING_TAG="$(git tag --points-at "${GITHUB_SHA}" --list 'v*')"
            if [[ -n "${MATCHING_TAG}" ]]; then
              SHOULD_BUILD=false
              echo "跳过已由标签构建覆盖的 main 分支提交：${MATCHING_TAG}"
            fi
          fi

          echo "should_build=${SHOULD_BUILD}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build unsigned iOS IPA
    needs: select_run
    if: needs.select_run.outputs.should_build == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      # needs.build outputs retain the successful BUILD attempt on release-only retries.
      attempt: ${{ steps.identity.outputs.attempt }}
      ipa_name: ${{ steps.identity.outputs.ipa_name }}
      ui_name: ${{ steps.identity.outputs.ui_name }}
      ipa_id: ${{ steps.ipa.outputs.artifact-id }}
      ui_id: ${{ steps.ui.outputs.artifact-id }}

    steps:
      - name: Identify immutable build artifacts
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          echo "attempt=${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"
          echo "ipa_name=NEU-Lumen-iOS-unsigned-${GITHUB_RUN_NUMBER}-attempt-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"
          echo "ui_name=NEU-Lumen-ui-preview-${GITHUB_RUN_NUMBER}-attempt-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          exec > >(tee build/toolchain-provenance.txt) 2>&1
          printf 'Runner image: %s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          sw_vers

          XCODE_APP="$(
            ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1
          )"

          if [[ -z "${XCODE_APP}" ]]; then
            echo "::error::找不到可用的 Xcode"
            exit 1
          fi

          echo "使用 ${XCODE_APP}"
          sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks
          swift --version
          xcrun simctl list runtimes --json

      - name: Test categories, timetable, grades and cookies
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "${RUNNER_TEMP}/catalog-tests.log") 2>&1
          swiftc \
            NEU-Lumen/Core/Support/JSONHelpers.swift \
            NEU-Lumen/Core/Models/PortalModels.swift \
            NEU-Lumen/Core/Models/ServiceCatalog.swift \
            NEU-Lumen/Core/Models/NativeCampusService.swift \
            NEU-Lumen/Core/Models/NativeMail.swift \
            NEU-Lumen/App/Navigation.swift \
            NEU-Lumen/Core/Models/CourseModels.swift \
            NEU-Lumen/Core/Models/GradeModels.swift \
            NEU-Lumen/Core/Models/AcademicResponse.swift \
            NEU-Lumen/Core/Services/Semester.swift \
            NEU-Lumen/Core/Networking/CookieJar.swift \
            NEU-Lumen/Core/Networking/NetworkError.swift \
            Tests/ServiceCatalog/main.swift \
            -o "${RUNNER_TEMP}/service-catalog-tests"
          "${RUNNER_TEMP}/service-catalog-tests"
          node Tests/AcademicBridge/check.mjs
          node Tests/Learning/check.mjs
          node Tests/Learning/cg-login.mjs
          node Tests/OffCampusLogin/document.mjs
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 Tests/Performance/check.py

      - name: Test holidays, favorites and card form parser
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "${RUNNER_TEMP}/planner-tests.log") 2>&1
          swiftc \
            NEU-Lumen/Core/Support/JSONHelpers.swift \
            NEU-Lumen/Core/Models/PortalModels.swift \
            NEU-Lumen/Core/Models/CourseModels.swift \
            NEU-Lumen/Core/Models/HTMLInputFields.swift \
            NEU-Lumen/Core/Models/HolidayRules.swift \
            NEU-Lumen/Core/Services/Semester.swift \
            NEU-Lumen/Core/Services/HolidayStore.swift \
            NEU-Lumen/Core/Persistence/ServiceFavorites.swift \
            Tests/Planner/main.swift \
            -o "${RUNNER_TEMP}/planner-tests"
          "${RUNNER_TEMP}/planner-tests"

      - name: Test off-campus login and service preservation
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "${RUNNER_TEMP}/login-tests.log") 2>&1
          swiftc \
            NEU-Lumen/Core/Support/JSONHelpers.swift \
            NEU-Lumen/Core/Support/LoadState.swift \
            NEU-Lumen/Core/Models/*.swift \
            NEU-Lumen/Core/Networking/*.swift \
            NEU-Lumen/Core/Persistence/CredentialStore.swift \
            NEU-Lumen/Core/Persistence/WebSessionStore.swift \
            NEU-Lumen/Core/Persistence/AssignmentCacheStore.swift \
            NEU-Lumen/Core/Services/SessionStore.swift \
            NEU-Lumen/Core/Services/DemoData.swift \
            NEU-Lumen/Core/Services/Semester.swift \
            Tests/OffCampusLogin/main.swift \
            -o "${RUNNER_TEMP}/off-campus-tests"
          "${RUNNER_TEMP}/off-campus-tests"

      - name: Test live activity data and configuration
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "${RUNNER_TEMP}/live-activity-data-tests.log") 2>&1
          swiftc \
            NEU-Lumen/Core/Support/JSONHelpers.swift \
            NEU-Lumen/Core/Support/LoadState.swift \
            NEU-Lumen/Core/Models/*.swift \
            NEU-Lumen/Core/Networking/*.swift \
            NEU-Lumen/Core/Persistence/CredentialStore.swift \
            NEU-Lumen/Core/Persistence/WebSessionStore.swift \
            NEU-Lumen/Core/Persistence/AssignmentCacheStore.swift \
            NEU-Lumen/Core/Services/SessionStore.swift \
            NEU-Lumen/Core/Services/DemoData.swift \
            NEU-Lumen/Core/Services/Semester.swift \
            NEU-Lumen/Core/Services/DynamicIslandStore.swift \
            Tests/LiveActivity/main.swift \
            -o "${RUNNER_TEMP}/live-activity-data-tests"
          "${RUNNER_TEMP}/live-activity-data-tests"

      - name: Test native browser download storage and contracts
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "${RUNNER_TEMP}/browser-download-tests.log") 2>&1
          python3 scripts/test_browser_downloads.py --require-swift -v

      - name: Test native data reliability policies
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "${RUNNER_TEMP}/data-reliability-tests.log") 2>&1
          swiftc \
            NEU-Lumen/Core/Support/LoadState.swift \
            NEU-Lumen/Core/Models/DataReliability.swift \
            Tests/DataReliability/main.swift \
            -o "${RUNNER_TEMP}/data-reliability-tests"
          "${RUNNER_TEMP}/data-reliability-tests"

      - name: Test native academic query protocols
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "${RUNNER_TEMP}/academic-query-tests.log") 2>&1
          python3 scripts/test_academic_queries.py --require-swift

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          bash build_ios_unsigned.sh 2>&1 | tee build/ios-build.log

      - name: Validate simulator UI and browser behavior
        run: bash scripts/validate_ui.sh

      - name: Require warning-free compiler logs
        # Add each new native test log here and increment --required-count together.
        run: >-
          python3 scripts/check_build_diagnostics.py --required-count 10
          "${RUNNER_TEMP}/catalog-tests.log"
          "${RUNNER_TEMP}/planner-tests.log"
          "${RUNNER_TEMP}/login-tests.log"
          "${RUNNER_TEMP}/live-activity-data-tests.log"
          "${RUNNER_TEMP}/browser-download-tests.log"
          "${RUNNER_TEMP}/data-reliability-tests.log"
          "${RUNNER_TEMP}/academic-query-tests.log"
          "${RUNNER_TEMP}/system-island-tests.log"
          build/ios-build.log build/ui-preview/simulator-build.log

      - name: Bind IPA and UI provenance to this successful build attempt
        run: python3 scripts/build_provenance.py record

      - name: Upload unsigned IPA
        id: ipa
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.identity.outputs.ipa_name }}
          path: |
            build/NEU-Lumen-iOS-unsigned.ipa
            build/build-provenance.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload UI screenshots and checks
        id: ui
        if: always() && hashFiles('build/ui-preview/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.identity.outputs.ui_name }}
          path: build/ui-preview/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    needs:
      - select_run
      - build
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      BUILD_ATTEMPT: ${{ needs.build.outputs.attempt }}
      IPA_ARTIFACT_ID: ${{ needs.build.outputs.ipa_id }}
      IPA_ARTIFACT_NAME: ${{ needs.build.outputs.ipa_name }}
      UI_ARTIFACT_ID: ${{ needs.build.outputs.ui_id }}
      UI_ARTIFACT_NAME: ${{ needs.build.outputs.ui_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download unsigned IPA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/build_provenance.py download ipa --dir release-assets

      - name: Verify IPA build provenance
        run: python3 scripts/build_provenance.py validate --ipa-only

      - name: Generate release body
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG_NAME="${GITHUB_REF_NAME}"
          RELEASE_TAGS="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name'
          )"
          PREVIOUS_TAG="$(
            awk -v current="${TAG_NAME}" '$0 != current { print; exit }' <<< "${RELEASE_TAGS}"
          )"

          if [[ -n "${PREVIOUS_TAG}" ]]; then
            git log "${PREVIOUS_TAG}..${TAG_NAME}" --pretty=format:"- %s" > release_commits.txt || true
          else
            : > release_commits.txt
          fi

          cat > release_body.md <<EOF
          这是由 GitHub Actions 自动构建的 NEU-Lumen iOS 发行版本。

          ## 下载说明

          - \`NEU-Lumen-iOS-unsigned.ipa\`：iOS 未签名安装包

          ## 安装说明

          该 IPA 未签名，不能直接作为 App Store 应用安装，需要自行签名后安装
          （Sideloadly / AltStore + 个人 Apple ID，或开发者证书）。

          ## 版本信息

          - 版本：\`${TAG_NAME}\`
          - Commit：\`${GITHUB_SHA}\`
          - 构建编号：\`${GITHUB_RUN_NUMBER}\`
          EOF

          if [[ -s release_commits.txt ]]; then
            echo "" >> release_body.md
            echo "## 更新内容" >> release_body.md
            echo "" >> release_body.md
            cat release_commits.txt >> release_body.md
          fi

          echo "" >> release_body.md
          echo "---" >> release_body.md
          echo "" >> release_body.md
          echo "由 GitHub Actions 自动发布。" >> release_body.md

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: NEU-Lumen ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release_body.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: release-assets/NEU-Lumen-iOS-unsigned.ipa

  manual_nightly:
    name: Publish dated manual nightly
    needs: build
    if: github.event_name == 'workflow_dispatch' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      BUILD_ATTEMPT: ${{ needs.build.outputs.attempt }}
      IPA_ARTIFACT_ID: ${{ needs.build.outputs.ipa_id }}
      IPA_ARTIFACT_NAME: ${{ needs.build.outputs.ipa_name }}
      UI_ARTIFACT_ID: ${{ needs.build.outputs.ui_id }}
      UI_ARTIFACT_NAME: ${{ needs.build.outputs.ui_name }}
    concurrency:
      group: publish-manual-nightly-${{ github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Recover interrupted dated prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish_manual_nightly.py --recover-only
      - name: Download verified unsigned IPA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/build_provenance.py download ipa --dir release-assets
      - name: Download screenshots from the same build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/build_provenance.py download ui --dir release-assets/ui-preview
      - name: Publish dated prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish_manual_nightly.py

  nightly:
    name: Publish rolling nightly IPA
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      BUILD_ATTEMPT: ${{ needs.build.outputs.attempt }}
      IPA_ARTIFACT_ID: ${{ needs.build.outputs.ipa_id }}
      IPA_ARTIFACT_NAME: ${{ needs.build.outputs.ipa_name }}
      UI_ARTIFACT_ID: ${{ needs.build.outputs.ui_id }}
      UI_ARTIFACT_NAME: ${{ needs.build.outputs.ui_name }}
    concurrency:
      group: publish-nightly
      cancel-in-progress: false
    steps:
      - name: Checkout publishing scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Recover interrupted rolling release before checking main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish_nightly.py --recover-only
      - name: Check current main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(gh api "repos/${GH_REPO}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "${CURRENT_SHA}" == "${GITHUB_SHA}" ]]; then
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          else
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "main 已更新，滚动 nightly 等待当前 main 完成检查。"
          fi
      - name: Download verified unsigned IPA
        if: steps.current.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/build_provenance.py download ipa --dir release-assets

      - name: Download screenshots from the same build
        if: steps.current.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/build_provenance.py download ui --dir release-assets/ui-preview

      - name: Publish nightly prerelease
        if: steps.current.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish_nightly.py
