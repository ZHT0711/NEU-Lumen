name: Build unsigned iOS artifact

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # UTC 19:17 = 次日北京时间 03:17，避开整点高峰。
    - cron: "17 19 * * *"

permissions:
  contents: read

concurrency:
  group: build-ios-unsigned-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  select_run:
    name: Avoid duplicate branch and tag builds
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.decision.outputs.should_build }}

    steps:
      - name: Checkout branch push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select build run
        id: decision
        shell: bash
        run: |
          set -euo pipefail

          SHOULD_BUILD=true
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            MATCHING_TAG="$(git tag --points-at "${GITHUB_SHA}" --list 'v*')"
            if [[ -n "${MATCHING_TAG}" ]]; then
              SHOULD_BUILD=false
              echo "跳过已由标签构建覆盖的 main 分支提交：${MATCHING_TAG}"
            fi
          fi

          echo "should_build=${SHOULD_BUILD}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build unsigned iOS IPA
    needs: select_run
    if: needs.select_run.outputs.should_build == 'true'
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail

          XCODE_APP="$(
            ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1
          )"

          if [[ -z "${XCODE_APP}" ]]; then
            echo "::error::找不到可用的 Xcode"
            exit 1
          fi

          echo "使用 ${XCODE_APP}"
          sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks

      - name: Test categories, timetable, grades and cookies
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "${RUNNER_TEMP}/catalog-tests.log") 2>&1
          swiftc \
            NEU-Lumen/Core/Support/JSONHelpers.swift \
            NEU-Lumen/Core/Models/PortalModels.swift \
            NEU-Lumen/Core/Models/ServiceCatalog.swift \
            NEU-Lumen/Core/Models/CourseModels.swift \
            NEU-Lumen/Core/Models/GradeModels.swift \
            NEU-Lumen/Core/Models/AcademicResponse.swift \
            NEU-Lumen/Core/Services/Semester.swift \
            NEU-Lumen/Core/Networking/CookieJar.swift \
            NEU-Lumen/Core/Networking/NetworkError.swift \
            Tests/ServiceCatalog/main.swift \
            -o "${RUNNER_TEMP}/service-catalog-tests"
          "${RUNNER_TEMP}/service-catalog-tests"
          node Tests/AcademicBridge/check.mjs
          node Tests/Learning/check.mjs
          node Tests/OffCampusLogin/document.mjs
          python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Test holidays, favorites and card form parser
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "${RUNNER_TEMP}/planner-tests.log") 2>&1
          swiftc \
            NEU-Lumen/Core/Support/JSONHelpers.swift \
            NEU-Lumen/Core/Models/PortalModels.swift \
            NEU-Lumen/Core/Models/CourseModels.swift \
            NEU-Lumen/Core/Models/HTMLInputFields.swift \
            NEU-Lumen/Core/Models/HolidayRules.swift \
            NEU-Lumen/Core/Services/Semester.swift \
            NEU-Lumen/Core/Services/HolidayStore.swift \
            NEU-Lumen/Core/Persistence/ServiceFavorites.swift \
            Tests/Planner/main.swift \
            -o "${RUNNER_TEMP}/planner-tests"
          "${RUNNER_TEMP}/planner-tests"

      - name: Test off-campus login and service preservation
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "${RUNNER_TEMP}/login-tests.log") 2>&1
          swiftc \
            NEU-Lumen/Core/Support/JSONHelpers.swift \
            NEU-Lumen/Core/Models/*.swift \
            NEU-Lumen/Core/Networking/*.swift \
            NEU-Lumen/Core/Persistence/CredentialStore.swift \
            NEU-Lumen/Core/Persistence/WebSessionStore.swift \
            NEU-Lumen/Core/Persistence/AssignmentCacheStore.swift \
            NEU-Lumen/Core/Services/SessionStore.swift \
            NEU-Lumen/Core/Services/DemoData.swift \
            NEU-Lumen/Core/Services/Semester.swift \
            Tests/OffCampusLogin/main.swift \
            -o "${RUNNER_TEMP}/off-campus-tests"
          "${RUNNER_TEMP}/off-campus-tests"

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          bash build_ios_unsigned.sh 2>&1 | tee build/ios-build.log

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7.0.2
        with:
          name: NEU-Lumen-iOS-unsigned-${{ github.run_number }}
          path: build/NEU-Lumen-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Validate simulator UI and browser behavior
        # A hosted runner can occasionally leave CoreSimulator in a data-migration
        # state. The native build and parser tests remain authoritative; the script
        # writes a diagnostic log and exits cleanly when the simulator itself is unavailable.
        run: bash scripts/validate_ui.sh

      - name: Require warning-free compiler logs
        run: python3 scripts/check_build_diagnostics.py "${RUNNER_TEMP}/catalog-tests.log" "${RUNNER_TEMP}/planner-tests.log" "${RUNNER_TEMP}/login-tests.log" build/ios-build.log build/ui-preview/simulator-build.log

      - name: Upload UI screenshots and checks
        if: always() && hashFiles('build/ui-preview/**') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: NEU-Lumen-ui-preview-${{ github.run_number }}
          path: build/ui-preview/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    needs:
      - select_run
      - build
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download unsigned IPA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "${GITHUB_RUN_ID}" --name "NEU-Lumen-iOS-unsigned-${GITHUB_RUN_NUMBER}" --dir release-assets

      - name: Generate release body
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG_NAME="${GITHUB_REF_NAME}"
          RELEASE_TAGS="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name'
          )"
          PREVIOUS_TAG="$(
            awk -v current="${TAG_NAME}" '$0 != current { print; exit }' <<< "${RELEASE_TAGS}"
          )"

          if [[ -n "${PREVIOUS_TAG}" ]]; then
            git log "${PREVIOUS_TAG}..${TAG_NAME}" --pretty=format:"- %s" > release_commits.txt || true
          else
            : > release_commits.txt
          fi

          cat > release_body.md <<EOF
          这是由 GitHub Actions 自动构建的 NEU-Lumen iOS 发行版本。

          ## 下载说明

          - \`NEU-Lumen-iOS-unsigned.ipa\`：iOS 未签名安装包

          ## 安装说明

          该 IPA 未签名，不能直接作为 App Store 应用安装，需要自行签名后安装
          （Sideloadly / AltStore + 个人 Apple ID，或开发者证书）。

          ## 版本信息

          - 版本：\`${TAG_NAME}\`
          - Commit：\`${GITHUB_SHA}\`
          - 构建编号：\`${GITHUB_RUN_NUMBER}\`
          EOF

          if [[ -s release_commits.txt ]]; then
            echo "" >> release_body.md
            echo "## 更新内容" >> release_body.md
            echo "" >> release_body.md
            cat release_commits.txt >> release_body.md
          fi

          echo "" >> release_body.md
          echo "---" >> release_body.md
          echo "" >> release_body.md
          echo "由 GitHub Actions 自动发布。" >> release_body.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: NEU-Lumen ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release_body.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: release-assets/NEU-Lumen-iOS-unsigned.ipa

  manual_nightly:
    name: Publish dated manual nightly
    needs: build
    if: github.event_name == 'workflow_dispatch' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download verified unsigned IPA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "${GITHUB_RUN_ID}" --name "NEU-Lumen-iOS-unsigned-${GITHUB_RUN_NUMBER}" --dir release-assets
      - name: Publish dated prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish_manual_nightly.py

  nightly:
    name: Publish rolling nightly IPA
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    concurrency:
      group: publish-nightly
      cancel-in-progress: false
    steps:
      - name: Check current main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(gh api "repos/${GH_REPO}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "${CURRENT_SHA}" == "${GITHUB_SHA}" ]]; then
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          else
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "main 已更新，滚动 nightly 等待当前 main 完成检查。"
          fi
      - name: Download verified unsigned IPA
        if: steps.current.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "${GITHUB_RUN_ID}" --name "NEU-Lumen-iOS-unsigned-${GITHUB_RUN_NUMBER}" --dir release-assets

      - name: Publish nightly prerelease
        if: steps.current.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh api "repos/${GH_REPO}/git/ref/tags/nightly" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GH_REPO}/git/refs/tags/nightly" \
              -f sha="${GITHUB_SHA}" -F force=true >/dev/null
          else
            gh api --method POST "repos/${GH_REPO}/git/refs" \
              -f ref=refs/tags/nightly -f sha="${GITHUB_SHA}" >/dev/null
          fi

          cat > nightly-notes.md <<EOF
          NEU-Lumen 每夜构建（滚动更新的预发布版本）。

          - 定时构建：北京时间每日 03:17；main 更新也会构建。
          - 提交：${GITHUB_SHA}
          - 构建：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - 产物：NEU-Lumen-iOS-unsigned.ipa，需自行签名安装。
          - 仅在回归、IPA 构建和模拟器检查全部通过后更新下载包。
          EOF

          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --title "NEU-Lumen Nightly" \
              --notes-file nightly-notes.md --prerelease --latest=false
          else
            gh release create nightly --verify-tag --title "NEU-Lumen Nightly" \
              --notes-file nightly-notes.md --prerelease --latest=false
          fi
          gh release upload nightly release-assets/NEU-Lumen-iOS-unsigned.ipa --clobber
