name: Build unsigned iOS artifact

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select_run:
    name: Avoid duplicate branch and tag builds
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decision.outputs.should_build }}

    steps:
      - name: Checkout branch push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select build run
        id: decision
        shell: bash
        run: |
          set -euo pipefail

          SHOULD_BUILD=true
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            MATCHING_TAG="$(git tag --points-at "${GITHUB_SHA}" --list 'v*')"
            if [[ -n "${MATCHING_TAG}" ]]; then
              SHOULD_BUILD=false
              echo "跳过已由标签构建覆盖的 main 分支提交：${MATCHING_TAG}"
            fi
          fi

          echo "should_build=${SHOULD_BUILD}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build unsigned iOS IPA
    needs: select_run
    if: needs.select_run.outputs.should_build == 'true'
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail

          XCODE_APP="$(
            ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1
          )"

          if [[ -z "${XCODE_APP}" ]]; then
            echo "::error::找不到可用的 Xcode"
            exit 1
          fi

          echo "使用 ${XCODE_APP}"
          sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks

      - name: Test categories, timetable, grades and cookies
        shell: bash
        run: |
          set -euo pipefail
          swiftc \
            NEU-Lumen/Core/Support/JSONHelpers.swift \
            NEU-Lumen/Core/Models/PortalModels.swift \
            NEU-Lumen/Core/Models/ServiceCatalog.swift \
            NEU-Lumen/Core/Models/CourseModels.swift \
            NEU-Lumen/Core/Models/GradeModels.swift \
            NEU-Lumen/Core/Models/AcademicResponse.swift \
            NEU-Lumen/Core/Services/Semester.swift \
            NEU-Lumen/Core/Networking/CookieJar.swift \
            NEU-Lumen/Core/Networking/NetworkError.swift \
            Tests/ServiceCatalog/main.swift \
            -o "${RUNNER_TEMP}/service-catalog-tests"
          "${RUNNER_TEMP}/service-catalog-tests"

      - name: Build unsigned IPA
        run: bash build_ios_unsigned.sh

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: NEU-Lumen-iOS-unsigned-${{ github.run_number }}
          path: build/NEU-Lumen-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Validate simulator UI and browser behavior
        run: bash scripts/validate_ui.sh

      - name: Upload UI screenshots and checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEU-Lumen-ui-preview-${{ github.run_number }}
          path: build/ui-preview/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Create GitHub Release
    needs:
      - select_run
      - build
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download unsigned IPA
        uses: actions/download-artifact@v4
        with:
          name: NEU-Lumen-iOS-unsigned-${{ github.run_number }}
          path: release-assets

      - name: Generate release body
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG_NAME="${GITHUB_REF_NAME}"
          RELEASE_TAGS="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.draft == false) | .tag_name'
          )"
          PREVIOUS_TAG="$(
            awk -v current="${TAG_NAME}" '$0 != current { print; exit }' <<< "${RELEASE_TAGS}"
          )"

          if [[ -n "${PREVIOUS_TAG}" ]]; then
            git log "${PREVIOUS_TAG}..${TAG_NAME}" --pretty=format:"- %s" > release_commits.txt || true
          else
            : > release_commits.txt
          fi

          cat > release_body.md <<EOF
          这是由 GitHub Actions 自动构建的 NEU-Lumen iOS 发行版本。

          ## 下载说明

          - \`NEU-Lumen-iOS-unsigned.ipa\`：iOS 未签名安装包

          ## 安装说明

          该 IPA 未签名，不能直接作为 App Store 应用安装，需要自行签名后安装
          （Sideloadly / AltStore + 个人 Apple ID，或开发者证书）。

          ## 版本信息

          - 版本：\`${TAG_NAME}\`
          - Commit：\`${GITHUB_SHA}\`
          - 构建编号：\`${GITHUB_RUN_NUMBER}\`
          EOF

          if [[ -s release_commits.txt ]]; then
            echo "" >> release_body.md
            echo "## 更新内容" >> release_body.md
            echo "" >> release_body.md
            cat release_commits.txt >> release_body.md
          fi

          echo "" >> release_body.md
          echo "---" >> release_body.md
          echo "" >> release_body.md
          echo "由 GitHub Actions 自动发布。" >> release_body.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: NEU-Lumen ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release_body.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: release-assets/NEU-Lumen-iOS-unsigned.ipa
