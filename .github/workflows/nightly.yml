name: Nightly build

on:
  schedule:
    # UTC 18:00 = 北京时间次日 02:00，每夜构建
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-build
  cancel-in-progress: false

jobs:
  build:
    name: Build nightly IPA
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail

          XCODE_APP="$(
            ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1
          )"

          if [[ -z "${XCODE_APP}" ]]; then
            echo "::error::找不到可用的 Xcode"
            exit 1
          fi

          echo "使用 ${XCODE_APP}"
          sudo xcode-select -s "${XCODE_APP}/Contents/Developer"
          xcodebuild -version

      - name: Build unsigned IPA
        run: bash build_ios_unsigned.sh

      - name: Name nightly artifact
        shell: bash
        run: |
          set -euo pipefail
          NIGHTLY_DATE="$(date -u +%Y%m%d)"
          NIGHTLY_SHA="$(git rev-parse --short HEAD)"
          NAME="NEU-Lumen-nightly-${NIGHTLY_DATE}-${NIGHTLY_SHA}.ipa"
          cp build/NEU-Lumen-iOS-unsigned.ipa "build/${NAME}"
          echo "NIGHTLY_NAME=${NAME}" >> "${GITHUB_ENV}"
          echo "NIGHTLY_DATE=${NIGHTLY_DATE}" >> "${GITHUB_ENV}"

      - name: Upload nightly artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ env.NIGHTLY_DATE }}
          path: build/${{ env.NIGHTLY_NAME }}
          if-no-files-found: error
          retention-days: 7

      - name: Push rolling nightly tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f nightly "${GITHUB_SHA}"
          git push -f origin nightly

      - name: Update nightly release
        uses: softprops/action-gh-release@v2
        with:
          name: Nightly Build ${{ env.NIGHTLY_DATE }}
          tag_name: nightly
          body: |
            每夜自动构建的 NEU-Lumen iOS 未签名安装包。

            - 构建日期：${{ env.NIGHTLY_DATE }}
            - Commit：${{ github.sha }}
            - 安装：未签名 IPA，需自行签名（Sideloadly / AltStore / 开发者证书）

            小改动不再刷正式版本号，每晚自动出包；正式 Release 仅在功能里程碑时发布。
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
          files: build/${{ env.NIGHTLY_NAME }}
